name: ArenaGeo - build and tests
on:
  push:
    branches: [develop]
    paths: ['arenageo-API/**', 'arenageo/**', 'supabase/**', '.github/workflows/backend-build.yml']
  pull_request:
    branches: [develop]
    paths: ['arenageo-API/**', 'arenageo/**', 'supabase/**', '.github/workflows/backend-build.yml']
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: arenageo-API/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: arenageo/package-lock.json
      - name: Backend unit and isolated PostgreSQL integration tests
        run: mvn -B verify dependency:build-classpath -Dmdep.outputFile=target/test-classpath
        working-directory: arenageo-API
      - run: npm ci
        working-directory: arenageo
      - run: npx tsc --noEmit && npm run lint && npm run build
        working-directory: arenageo
      - run: node --test tests/quadro-tatico.test.mjs
        working-directory: arenageo
      - run: npx playwright install --with-deps chromium
        working-directory: arenageo
      - name: Start disposable E2E API
        working-directory: arenageo-API
        run: java -cp "target/test-classes:target/classes:$(cat target/test-classpath)" com.arenageo.service.CadastroE2eServer > /tmp/arenageo-api.log 2>&1 &
      - name: Start frontend against isolated API
        working-directory: arenageo
        run: NEXT_PUBLIC_API_URL=http://localhost:8088 npm run dev -- --port 3100 > /tmp/arenageo-web.log 2>&1 &
      - name: Wait for isolated servers
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8088/esportes >/dev/null && curl -fsS http://127.0.0.1:3100 >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:e2e
        working-directory: arenageo

      - name: Preserve validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: |
            arenageo/test-results/
            arenageo-API/target/surefire-reports/
            /tmp/arenageo-api.log
            /tmp/arenageo-web.log
