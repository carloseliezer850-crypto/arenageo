name: Backend build

on:
  push:
    branches:
      - develop
      - "refactor/**"
    paths:
      - "arenageo-API/**"
      - ".github/workflows/backend-build.yml"
  pull_request:
    branches: [develop]
    paths:
      - "arenageo-API/**"
      - ".github/workflows/backend-build.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify
        run: mvn -B verify
        working-directory: arenageo-API
